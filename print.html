<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF</title>
<style>
@page{size:A4;margin:14mm 12mm}
*{box-sizing:border-box}
:root{--a:#2f7bd9;--ink:#14202e;--line:#b9c6d8;--soft:#f6f9fd;--th:#e4edf8}
body{margin:0;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","DejaVu Sans",Arial,sans-serif;line-height:1.9;color:var(--ink);background:#fff;font-size:14px}
bdi{font-family:"Segoe UI",Arial,sans-serif}
.bar{background:#0f1722;color:#fff;padding:10px 14px;text-align:center}
.bar button{font:inherit;font-weight:800;background:#0c9a52;color:#fff;border:0;border-radius:99px;padding:8px 26px;cursor:pointer;font-size:17px}
.bar p{margin:6px 0 0;font-size:13px;opacity:.85}
.sal{background:#0c9a52;color:#fff;text-align:center;font-weight:800;font-size:18px;padding:3px}
.doc{max-width:820px;margin:0 auto;padding:14px 18px 30px}
header{text-align:center;border-bottom:4px solid var(--a);padding-bottom:8px;margin-bottom:10px}
header h1{margin:0;font-size:24px}header p{margin:2px 0;color:#4d6079}
section{break-inside:avoid-page;margin:12px 0}
h2{font-size:17px;margin:0 0 4px;background:var(--th);border-right:6px solid var(--a);padding:3px 12px;border-radius:8px}
.gn{display:inline-block;background:var(--a);color:#fff;border-radius:50%;width:24px;height:24px;line-height:24px;text-align:center;margin-left:6px;font-size:13px}
.tw{overflow-x:auto;margin:10px 0}table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:right;vertical-align:top}th{background:var(--th)}
ol,ul{padding-right:26px;margin:8px 0}li{margin:4px 0}p{margin:8px 0}
.formula{background:var(--soft);border:1px solid var(--line);border-right:5px solid var(--a);border-radius:12px;padding:8px 14px;margin:10px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;break-inside:avoid}
.fx{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.frac{display:inline-flex;flex-direction:column;align-items:center;text-align:center;line-height:1.5}
.frac span:first-child{border-bottom:2px solid currentColor;padding:0 8px}.frac span:last-child{padding:0 8px}
.qa{border:1px dashed var(--a);border-radius:14px;padding:8px 14px;margin:10px 0;background:var(--soft);break-inside:avoid}
.qa .q{font-weight:800}.qa .a{margin-top:4px;padding-top:4px;border-top:1px dashed var(--line)}.rv{display:none}
@media print{.bar{display:none}.doc{padding:0;max-width:none}}
</style></head><body>
<div class="bar"><button id="pb" type="button">🖨️ اطبع / احفظ كـ PDF</button><p>في نافذة الطباعة اختار «حفظ كـ PDF» (Save as PDF).</p></div>
<div class="sal">اللهم صلِّ وسلِّم على سيدنا محمد وعلى آله وصحبه</div>
<div class="doc" id="doc">جاري التحميل…</div>
<script src="config.js"></script><script src="courses.js"></script><script src="items.js"></script>
<script>
(async function(){
 const CFG=self.APP_CONFIG||{}, U=CFG.SUPABASE_URL, K=CFG.SUPABASE_ANON_KEY, LOCAL=self.LOCAL_ITEMS||[];
 const doc=document.getElementById('doc'); document.getElementById('pb').onclick=()=>window.print();
 const hdr=()=>Object.assign({apikey:K},(K||'').indexOf('eyJ')===0?{Authorization:'Bearer '+K}:{});
 const id=decodeURIComponent((location.hash||'').replace(/^#\/?/,''));
 try{
  if(U){ try{const r=await fetch(U+'/rest/v1/courses?select=*&order=sort.asc',{headers:hdr()}); if(r.ok){const rows=await r.json(); if(rows.length) self.COURSES=rows;}}catch(e){} }
  let it=LOCAL.find(x=>x.id===id);
  if(U&&!it){const r=await fetch(U+'/rest/v1/items?id=eq.'+encodeURIComponent(id)+'&select=*',{headers:hdr()}); const rows=await r.json(); it=rows[0];}
  if(!it||!it.html_path) throw new Error('nf');
  const url=it.html_path.indexOf('files/')===0?it.html_path:U+'/storage/v1/object/public/files/'+it.html_path.split('/').map(encodeURIComponent).join('/');
  const t=await (await fetch(url)).text();
  const i=t.indexOf('const D='), j=t.indexOf(';const G=D.groups',i); if(i<0||j<0) throw new Error('fmt');
  const D=JSON.parse(t.slice(i+8,j));
  const c=COURSES.find(x=>x.id===it.course_id)||{name:'',icon:'',a:'#2f7bd9'}, K2=KINDS[it.kind];
  document.documentElement.style.setProperty('--a',c.a);
  document.title=c.name+' - '+K2.one+' '+it.number;
  const body=D.groups.map((g,k)=>'<section><h2><span class="gn">'+(k+1)+'</span> '+g.t+'</h2>'+g.h.split('class="qa"').join('class="qa" data-p="1"')+'</section>').join('');
  doc.innerHTML='<header><h1>'+c.icon+' '+c.name+' — '+K2.one+' '+it.number+'</h1><p>'+(it.title||'')+'</p></header>'+body;
  doc.querySelectorAll('.qa .a').forEach(a=>{a.style.display='block'});
  setTimeout(()=>{try{window.print();}catch(e){}},700);
 }catch(e){ doc.innerHTML='<p style="text-align:center">مش قادر أفتح المحتوى. اتأكد من النت وجرّب تاني.</p>'; }
})();
</script></body></html>
